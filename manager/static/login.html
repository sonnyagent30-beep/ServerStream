<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ServerStream — Sign in</title>
<style>
  :root{
    --bg:#0b0f14; --card:#131a22; --card2:#0f151c; --border:#243040;
    --text:#dbe4ee; --muted:#7d8fa3; --accent:#4dabf7; --green:#3fb950; --red:#f85149;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .wrap{width:100%;max-width:380px}
  .logo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 26px}
  h1{font-size:1.05rem;font-weight:600;text-align:center;margin-bottom:5px}
  .sub{color:var(--muted);font-size:.83rem;text-align:center;margin-bottom:24px}
  form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px}
  label{display:block;font-size:.76rem;color:var(--muted);margin:0 0 6px}
  input{
    width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:11px 13px;font-size:.9rem;font-family:inherit;margin-bottom:16px;
  }
  input:focus{outline:none;border-color:var(--accent)}
  button{
    width:100%;background:var(--accent);color:#06121f;border:none;border-radius:8px;
    padding:12px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:inherit;
  }
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.6;cursor:wait}
  .err{
    background:#2a1315;border:1px solid #4d1f1c;color:#ff9d95;border-radius:8px;
    padding:10px 13px;font-size:.83rem;margin-bottom:16px;display:none;
  }
  .err.show{display:block}
  .foot{color:var(--muted);font-size:.74rem;text-align:center;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/static/logo.png" alt="ServerStream">
  <h1>Dashboard sign in</h1>
  <p class="sub">Authorised access only</p>

  <form id="f">
    <div class="err" id="err"></div>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="b">Sign in</button>
  </form>

  <p class="foot">
    Credentials are set in <code>.env</code> on the server.<br>
    Lost them? SSH in and run <code>cat /opt/serversstream/.env</code>.
  </p>
</div>

<script>
const $ = s => document.querySelector(s);
const errBox = $("#err");
function fail(msg){ errBox.textContent = msg; errBox.classList.add("show"); }

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  errBox.classList.remove("show");
  const btn = $("#b");
  btn.disabled = true; btn.textContent = "Signing in…";
  try{
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({username: $("#u").value, password: $("#p").value})
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error || "Sign in failed");
    location.href = "/";
  }catch(err){
    fail(err.message || "Sign in failed");
    btn.disabled = false; btn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
