# ServerStream edge - terminates RTMPS ingest, forwards plain RTMP to SRS.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

stream {
    server {
        listen 1936 ssl;
        proxy_pass srs:1935;
        proxy_connect_timeout 10s;
        proxy_timeout 6h;

        ssl_certificate     /etc/letsencrypt/live/sonnystream.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sonnystream.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
    }

    server {
        listen 1935;
        proxy_pass srs:1935;
        proxy_connect_timeout 10s;
        proxy_timeout 6h;
    }
}
