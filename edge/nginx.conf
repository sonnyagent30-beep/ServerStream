# ServerStream edge - terminates RTMPS ingest, forwards plain RTMP to SRS.
#
# The certificate path below is rewritten by deploy.sh to match your actual
# Let's Encrypt/ACME certificate directory. If you use a different cert path,
# edit it here.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

stream {
    # Encrypted ingest. Use this from OBS when you want TLS on the OBS->server leg.
    server {
        listen 1936 ssl;
        proxy_pass srs:1935;
        proxy_connect_timeout 10s;
        proxy_timeout 6h;

        ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
    }

    # Plain RTMP ingest.
    server {
        listen 1935;
        proxy_pass srs:1935;
        proxy_connect_timeout 10s;
        proxy_timeout 6h;
    }
}
