# ServerStream - SRS (Simple Realtime Server) 5.x
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

stats {
    network         0;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     off;

    publish {
        mr          off;
    }

    play {
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }

    # Reject publishers that do not present the configured stream key.
    # (http_hooks is a vhost-level directive, not a global one.)
    http_hooks {
        enabled         on;
        on_publish      http://manager:8081/api/hooks/on_publish;
        on_unpublish    http://manager:8081/api/hooks/on_unpublish;
    }

    # HLS is intentionally OFF. It was only ever used for the dashboard
    # preview, which is gone - no viewers, no HLS segments on disk, no RAM.
    # The standby publisher and the platform restreamers use RTMP end to end.

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    # NOTE: no `push` directives here on purpose.
    # SRS cannot push to rtmps:// endpoints, which Facebook Live requires.
    # The manager service supervises one FFmpeg process per platform instead.
}
