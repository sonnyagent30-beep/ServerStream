# Host nginx vhost for ServerStream. Installed by deploy.sh, which substitutes
# __DOMAIN__ with your hostname. Serves the dashboard + API.
#
# HLS is deliberately absent: it is disabled on SRS because there is no viewer
# preview. RTMP/RTMPS ingest goes straight to the edge container on 1935/1936.

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Dashboard, API and the standby image (12 MB uploads allowed above).
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # standby image uploads arrive as JSON data-URLs, which can be large
        proxy_request_buffering off;
    }
}
